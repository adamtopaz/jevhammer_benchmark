[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevhammer-benchmark"
version = "0.1.0"
description = "Reproducible source-location benchmarks for JevHammer"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
jevbench = "jevhammer_benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["jevhammer_benchmark*"]
