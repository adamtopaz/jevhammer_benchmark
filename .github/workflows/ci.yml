name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Lean
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - name: Cache compiled dependencies
        uses: actions/cache@v4
        with:
          path: .lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Build and test in one bounded process tree
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          sudo systemd-run --scope -p MemoryMax=12000000000 -p MemorySwapMax=0 --uid="$(id -u)" --gid="$(id -g)" --setenv=PATH="$PATH" bash -c 'lake exe cache get && bash tests/run.sh'
      - run: python -m pip install .
      - run: jevbench --help
